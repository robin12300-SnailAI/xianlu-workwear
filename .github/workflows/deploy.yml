name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 静态导出不支持 API 路由、sitemap、robots
      - name: Remove dynamic routes for static export
        run: |
          rm -rf src/app/api
          rm -f src/app/sitemap.ts
          rm -f src/app/robots.ts

      - name: Build with Next.js static export
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          NODE_ENV: production

      - name: Upload artifact (for GitHub Actions-based Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # 兼容 Legacy 模式：将构建产物推送到 gh-pages 分支
      - name: Deploy to gh-pages branch (legacy fallback)
        run: |
          cd out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy $(date +'%Y-%m-%d %H:%M:%S')"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages 2>&1 || echo "gh-pages push failed (non-fatal)"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
